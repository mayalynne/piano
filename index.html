<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6;--surface:#FFFFFF;--ink:#202020;--mute:#6E6E6A;--line:#E6E6E3;--soft:#F2F1ED;
  --red:#E74B3C;--blue:#3268D8;--yellow:#F2C94C;--green:#6A9E7A;
  --keyw:#FFFFFF;--keyline:#D8D7D2;--keydown:#ECEBE6;--keyb:#202020;--keybdown:#45443F;--felt:#202020;
  --font:"Geist","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171716;--surface:#1F1F1D;--ink:#EDECE8;--mute:#8F8E89;--line:#2F2F2C;--soft:#262624;
    --keyw:#F4F3EF;--keyline:#B9B8B2;--keydown:#DAD9D3;--keyb:#141413;--keybdown:#4A4944;--felt:#0E0E0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171716;--surface:#1F1F1D;--ink:#EDECE8;--mute:#8F8E89;--line:#2F2F2C;--soft:#262624;
  --keyw:#F4F3EF;--keyline:#B9B8B2;--keydown:#DAD9D3;--keyb:#141413;--keybdown:#4A4944;--felt:#0E0E0D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:36px;height:58px}
.mark{display:flex;align-items:center;gap:5px;color:var(--ink);text-decoration:none}
.mark i{display:block;width:8px;height:8px;border-radius:50%}
.mark span{margin-left:9px;font-weight:500;letter-spacing:-.01em}
#nav{display:flex;gap:26px}
#nav a{position:relative;color:var(--mute);text-decoration:none;font-size:14px;padding:6px 0}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--ink)}
#nav a.on::after{content:"";position:absolute;left:50%;bottom:-3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
@media (max-width:700px){.mark span{display:none}#nav{gap:16px}.top-in{gap:18px}.chip .chip-t{display:none}}

.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);font-size:13px}
.chip:hover{border-color:var(--mute)}
.st{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.st.on{background:var(--green)}
.st.warn{background:var(--yellow)}

/* type */
h1{font-size:clamp(34px,5vw,50px);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:48px 0 18px}
h2{font-size:22px;font-weight:500;letter-spacing:-.015em;line-height:1.25;margin:0}
h3{font-size:15px;font-weight:500;margin:0}
.meta{color:var(--mute);font-size:13px}
p{margin:0}
a{color:inherit}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:19px;background:var(--surface);font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--mute)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover:not(:disabled){opacity:.88}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute);padding:0 6px}
.btn.ghost:hover:not(:disabled){color:var(--ink)}
.btn:disabled{opacity:.38}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font-size:inherit}
.link:hover{text-decoration-color:var(--ink)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:19px;padding:3px;background:var(--surface);gap:2px;flex-wrap:nowrap}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:15px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--soft);color:var(--ink)}

.tog{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 4px;border:0;background:none;font-size:13px;color:var(--mute)}
.tog::before{content:"";width:26px;height:16px;border-radius:8px;background:var(--mute);opacity:.45;transition:background .15s,opacity .15s}
.tog.on{color:var(--ink)}
.tog.on::before{background:var(--ink);opacity:1}
.tog{position:relative}
.tog::before{flex:none;box-sizing:border-box}
.tog::after{content:"";position:absolute;left:7px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);box-sizing:border-box;transition:transform .15s}
.tog.on::after{transform:translateX(10px)}

/* piano */
.piano{margin-top:6px}
.kb-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.kb-inner{position:relative;min-width:100%}
.kb-ruler{position:relative;height:30px}
.rs{position:absolute;bottom:4px;height:7px;border:1px solid var(--mute);border-bottom:0;opacity:.7}
.rs b{position:absolute;left:50%;top:-19px;transform:translateX(-50%);font-weight:400;font-size:11px;color:var(--mute);background:var(--bg);padding:0 4px;line-height:16px}
.kb{position:relative;height:clamp(150px,21vw,232px);border-top:3px solid var(--felt);touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wk{position:absolute;top:0;bottom:0;background:var(--keyw);border:1px solid var(--keyline);border-top:0;border-left-width:0;border-radius:0 0 6px 6px;transition:background .06s}
.wk:first-child{border-left-width:1px}
.bk{position:absolute;top:0;height:61%;background:var(--keyb);border-radius:0 0 4px 4px;z-index:2;transition:background .06s}
.wk.down{background:var(--keydown)}
.bk.down{background:var(--keybdown)}
.dot{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;color:transparent;transition:background-color .2s,border-color .2s,transform .16s;animation:pop .2s ease-out}
.wk.heard{background:var(--blue)!important;border-color:var(--blue)}
.toast{position:fixed;z-index:60;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));padding:12px 18px;background:var(--ink);color:var(--bg);border-radius:14px;font-size:15px;line-height:1.4}
.bk.heard{background:var(--blue)!important}
.hear{position:fixed;z-index:44;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:22px;font-size:14px;max-width:calc(100vw - 130px)}
.hear .lv{width:70px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;flex:none}
.hear .lv i{display:block;height:100%;width:0;background:var(--green);transition:width .06s}
.hear b{font-weight:600;min-width:60px}
.wk .dot{bottom:36px}
.bk .dot{bottom:13px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.dot.c-red{background:var(--red);color:var(--red)}
.dot.c-blue{background:var(--blue);color:var(--blue)}
.dot.c-yellow{background:var(--yellow);color:var(--yellow)}
.dot.c-green{background:var(--green);color:var(--green)}
.dot.c-ink{background:#202020;color:#202020}
.dot.c-paper{background:#FAF9F6;color:#FAF9F6}
.dot.ring{background:transparent;border:2px solid currentColor}
.dot.hit{transform:scale(1.3)}
.dot.xtra{background:transparent;border:1.5px solid #9A9993;width:10px;height:10px;margin-left:-5px}
.kl{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:11px;line-height:1;color:#76756F;pointer-events:none}
.bk .kl{bottom:31px;font-size:9.5px;color:#C9C8C2}
@media (max-width:640px){.dot{width:10px;height:10px;margin-left:-5px}.wk .dot{bottom:30px}.kl{font-size:10px}}
@media (prefers-reduced-motion:reduce){.dot{animation:none;transition:none}}
.kb-bar{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}
.kb-bar .sp{flex:1}
.kb-range{display:inline-flex;align-items:center;gap:2px}
.kb-range button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:15px;font-size:14px;line-height:1;color:var(--ink)}
.kb-range span{min-width:86px;text-align:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ldot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.ldot.ring{background:transparent!important;border:2px solid}
.sel-note{color:var(--ink)}

/* pages */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.lesson-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px}
.stepper li{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--surface)}
.stepper li.on{color:var(--ink);border-color:var(--ink)}
.stepper li.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.ws{border-top:1px solid var(--line);padding-top:24px}
.ws-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 32px;flex-wrap:wrap;margin-bottom:12px}
.ws-task{max-width:58ch;font-size:16px}
.ws-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ws-bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:14px 32px;flex-wrap:wrap;margin-top:18px}
.ws-bottom:has(.ws-info:empty):has(.ws-actions:empty){display:none}
.ws-fb:empty{display:none}
body .ws-fb,body .ws-fb:empty{display:flex;min-height:24px;margin:8px 0 0;padding:0;max-width:820px;background:none;border:0;border-radius:0;font-size:15px;line-height:1.45;font-weight:400;color:var(--ink);align-items:flex-start}
body .kb-ruler{height:22px}
body .ws-fb.hint{color:var(--ink)}
body .ws-fb.ok{border-left-color:var(--green)}
.task .ws-info{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.task .ws-info:empty{display:none}
body .ws-bottom{justify-content:flex-end}
.ws-actions .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.ws-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ws-fb{min-height:24px;margin-top:18px;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:center}
.ws-fb.hint{color:var(--mute)}
.ws-fb.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.ws-fb.bad::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute);flex:none}
.ws-guide{display:flex;gap:12px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:14px;max-width:820px}
.ws-guide .gd{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:none;transform:translateY(-2px)}
.ws-guide p{flex:1}
body h1{margin:12px 0 6px;font-size:clamp(24px,3.2vw,32px)}
body .stepper{margin:0 0 10px}
body .ws{padding-top:12px}
body .ws-top{margin-bottom:4px}
body .task{padding:12px 20px}
body .task-k{margin-bottom:4px}
body .task-one{font-size:17px}
body .task .ws-info{margin-top:8px;padding-top:8px}
body .kb{height:clamp(100px,17vh,170px)}
body .piano{margin-top:2px}
body .kb-bar{margin-top:8px}
body .ws-bottom{margin-top:8px}
body .ws-guide{margin-top:8px;padding:0 0 8px;border-top:0;border-bottom:1px solid var(--line)}
body .run-nav{margin-top:10px;padding-right:0;justify-content:flex-start;gap:18px}
body .run-nav .btn.ghost{padding-left:0}
body main{padding-bottom:70px}
.run-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.run-nav .btn.primary{height:46px;padding:0 28px;border-radius:23px;font-size:15px;font-weight:500}
.run-nav .btn.primary:disabled{background:var(--line);border-color:var(--line);color:var(--mute);opacity:1}

.chordsel{display:flex;gap:4px;flex-wrap:wrap}
.chordsel button{position:relative;border:0;background:none;font-size:20px;letter-spacing:-.01em;padding:4px 10px 10px;color:var(--mute)}
.chordsel button:hover{color:var(--ink)}
.chordsel button.on{color:var(--ink)}
.chordsel button.on::after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.chordsel button.built{color:var(--ink)}

.readout{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.ro-name{font-size:30px;font-weight:500;letter-spacing:-.025em;line-height:1}
.ro-sub{color:var(--mute);font-size:13px;margin-top:6px}
.ro-why{font-size:16px;line-height:1.4;margin-top:10px;max-width:34em;color:var(--ink)}
.ro-tones{display:flex;gap:22px}
.ro-tone{display:flex;flex-direction:column;gap:2px}
.ro-tone .n{display:flex;align-items:center;gap:7px;font-size:17px}
.ro-tone .r{font-size:12px;color:var(--mute)}

.big-now{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap}
.big-now .now{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
.big-now .next{font-size:16px;color:var(--mute)}
.prog-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.prog-list span{font-size:15px;color:var(--mute);padding-bottom:4px;border-bottom:2px solid transparent}
.prog-list span.on{color:var(--ink);border-bottom-color:var(--ink)}
.prog-list span.done{color:var(--ink)}

.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts .btn.right{border-color:var(--green);color:var(--ink)}
.opts .btn.wrong{border-color:var(--line);color:var(--mute);text-decoration:line-through}

/* curriculum */
.path{margin:64px 0 40px}
.path-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:12px}
.mod{display:grid;grid-template-columns:200px 1fr;gap:12px 32px;padding:20px 0;border-bottom:1px solid var(--line)}
.mod-t .meta{display:block}
.mod-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px}
.lrow{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:5px 0;text-align:left;font-size:14px;color:var(--ink)}
.lrow .num{color:var(--mute);font-size:12px;min-width:26px;font-variant-numeric:tabular-nums}
.lrow .s{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);flex:none;transform:translateY(-1px)}
.lrow.done .s{background:var(--ink);border-color:var(--ink)}
.lrow.cur .s{border-color:var(--ink)}
.lrow:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
@media (max-width:700px){.mod{grid-template-columns:1fr}}

/* songs */
.songbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;width:100%}
select.inp{width:auto;height:38px;padding:0 34px 0 14px;border-radius:19px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 16px,calc(100% - 13px) 16px;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{font-family:var(--font);line-height:1.6;resize:vertical;min-height:120px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:900px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
@media (max-width:700px){.form{grid-template-columns:1fr 1fr}.form .w2,.form .w4{grid-column:1/-1}}
.err{color:var(--red);font-size:13px}
.help{color:var(--mute);font-size:13px;max-width:70ch}
.song-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-top:6px}
.timeline{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.tname{background:none;border:0;padding:6px 0;text-align:left;font-size:13px;color:var(--mute)}
.tname:hover{color:var(--ink)}
.tname.loop{color:var(--ink)}
.tname.loop::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:7px;transform:translateY(-1px)}
.tbars{display:flex;flex-wrap:wrap;gap:0}
.bar{min-width:58px;height:34px;padding:0 10px;border:0;border-left:1px solid var(--line);background:none;text-align:left;font-size:15px;color:var(--mute)}
.bar:hover{color:var(--ink)}
.bar.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.bar.past{color:var(--ink)}
@media (max-width:640px){.trow{grid-template-columns:1fr;gap:2px}}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:18px}
.controls .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tempo{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.tempo input{width:120px;accent-color:var(--ink)}
.tempo b{font-weight:400;color:var(--ink);min-width:58px;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:22px 0}

/* practice + progress */
.plan{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0 28px}
.plan>div{padding:18px 18px 18px 0;border-right:1px solid var(--line)}
.plan>div+div{padding-left:18px}
.plan>div:last-child{border-right:0}
.plan .mins{font-size:28px;font-weight:500;letter-spacing:-.02em}
.plan .lab{font-size:14px;margin-top:2px}
.plan .d{font-size:13px;color:var(--mute);margin-top:6px}
@media (max-width:760px){.plan{grid-template-columns:1fr 1fr}.plan>div:nth-child(2){border-right:0}.plan>div:nth-child(3){padding-left:0}.plan>div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 32px;margin-top:8px}
.drill{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.drill p{font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);margin:8px 0 36px}
.stats>div{padding:18px 18px 18px 0}
.stats .v{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.stats .k{font-size:13px;color:var(--mute)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.sec{margin:34px 0}
.sec h2{margin-bottom:14px}
.clist{display:flex;flex-wrap:wrap;gap:8px 22px}
.citem{display:inline-flex;align-items:center;gap:8px;font-size:16px}
.citem small{color:var(--mute);font-size:12px}

/* ===== Player: scheduled playback on the audio clock ===== */
class Player{
  constructor(){this.events=[];this.total=0;this.bpm=90;this.playing=false;this.pos=0;this.t0=0;this.idx=0;this.loop=null;this.metro=false;this.filter=()=>true;this.voices=[];this.onFrame=null;this.onEnd=null;}
  load(ev,total){this.stop();this.events=ev.slice().sort((a,b)=>a.beat-b.beat);this.total=total;this.pos=0;}
  spb(){return 60/this.bpm;}
  timeOf(b){return this.t0+(b-this.pos)*this.spb();}
  get beat(){return this.playing?Math.max(this.pos,this.pos+(Sound.ctx.currentTime-this.t0)/this.spb()):this.pos;}
  firstIdx(b){const i=this.events.findIndex(e=>e.beat>=b-1e-6);return i<0?this.events.length:i;}
  play(){
    if(this.playing||!this.total) return; const ctx=Sound.ensure(); const end=this.loop?this.loop.b:this.total;
    if(this.pos>=end-1e-6||(this.loop&&this.pos<this.loop.a)) this.pos=this.loop?this.loop.a:0;
    this.t0=ctx.currentTime+0.08; this.idx=this.firstIdx(this.pos); this.clickB=Math.ceil(this.pos-1e-6); this.playing=true;
    this.timer=setInterval(()=>this.tick(),25); this.tick();
    const fr=()=>{if(!this.playing) return; this.onFrame?.(this.beat); this.raf=requestAnimationFrame(fr);}; this.raf=requestAnimationFrame(fr);
  }
  halt(){this.playing=false; clearInterval(this.timer); cancelAnimationFrame(this.raf);}
  pause(){if(!this.playing) return; this.pos=this.beat; this.halt(); this.silence(); this.onFrame?.(this.pos);}
  stop(){if(this.playing){this.pos=this.beat; this.halt();} this.silence();}
  seek(b){const was=this.playing; if(was){this.halt(); this.silence();} this.pos=b; if(was) this.play(); else this.onFrame?.(b);}
  setTempo(bpm){if(this.playing){const b=this.beat; this.halt(); this.silence(); this.pos=b; this.bpm=bpm; this.play();} else this.bpm=bpm;}
  silence(){this.voices.forEach(v=>v.stop()); this.voices=[];}
  tick(){
    const ctx=Sound.ctx, now=ctx.currentTime, hz=now+0.15;
    for(let guard=0;guard<4;guard++){
      const end=this.loop?this.loop.b:this.total;
      while(this.idx<this.events.length){const e=this.events[this.idx]; if(e.beat>=end-1e-6){this.idx=this.events.length;break;}
        const t=this.timeOf(e.beat); if(t>=hz) break;
        if(this.filter(e)) this.voices.push(Sound.note(e.m,e.vel??0.6,Math.max(t,now),Math.max(0.08,Math.min(e.dur,end-e.beat)*this.spb()*0.97)));
        this.idx++;}
      while(this.clickB<end-1e-6&&this.timeOf(this.clickB)<hz){if(this.metro) Sound.click(Math.max(this.timeOf(this.clickB),now),mod(this.clickB,4)===0); this.clickB++;}
      const tEnd=this.timeOf(end);
      if(tEnd<hz){
        if(this.loop){this.t0=tEnd; this.pos=this.loop.a; this.idx=this.firstIdx(this.loop.a); this.clickB=Math.ceil(this.loop.a-1e-6); this.onWrap?.(); continue;}
        if(now>=tEnd){this.halt(); this.pos=end; this.onFrame?.(end); this.onEnd?.();}
      }
      break;
    }
    if(this.voices.length>160) this.voices=this.voices.slice(-80);
  }
}

function recipeWhy(c){
  if(c.q==='') return 'Every major chord uses this recipe: root, up 4 half steps, up 3 more. The 4 is what makes it major.';
  if(c.q==='m') return 'Every minor chord uses this recipe: root, up 3 half steps, up 4 more. The 3 is what makes it minor.';
  return `${c.long.charAt(0).toUpperCase()+c.long.slice(1)}: ${c.tones.map(t=>t.role.toLowerCase()).join(', ')}.`;
}
function formulaText(c){const v=voicing(c,0); return 'Root'+v.slice(1).map((m,i)=>' +'+(m-v[i])).join('');}
const LANDMARK={0:'C is just left of a pair of black keys.',2:'D sits in the middle of the pair of black keys.',4:'E is just right of the pair of black keys.',
  5:'F is just left of the group of three black keys.',7:'G is between the first two of the three black keys.',9:'A is between the last two of the three black keys.',
  11:'B is just right of the group of three black keys.',1:'C♯ / D♭ is the left key of the pair.',3:'D♯ / E♭ is the right key of the pair.',
  6:'F♯ / G♭ is the first of the three black keys.',8:'G♯ / A♭ is the middle of the three black keys.',10:'A♯ / B♭ is the last of the three black keys.'};

/* Build a chord one note at a time, counting half steps */
STEP.recipe=(d,api)=>{
  const {w}=api; const c=parseChord(d.chord); const base=voicing(c,0); const n=c.tones.length;
  const placed=[]; let k=0, slips=0, showCount=!d.blind, fin=false;
  w.task.append(taskBlock(d.text||`Build ${c.label} one note at a time.`));
  const line=h('div',{class:'recipe'}), why=h('p',{class:'why'}); w.info.append(line,why);
  w.actions.append(h('button',{class:'btn ghost',onclick:()=>Sound.chord(base)},'Hear the chord'),
    d.blind?h('button',{class:'btn ghost',onclick:()=>{showCount=true; slips++; draw();}},'Show the count'):null);
  const gap=i=>c.tones[i].semi-c.tones[i-1].semi;
  const target=()=>k===0?base[0]:placed[k-1]+gap(k);
  function draw(){
    const mk=placed.map((m,i)=>({m,color:c.tones[i].color,name:c.tones[i].name}));
    if(k===0&&!d.blind&&!fin) mk.push({m:base[0],color:'red',ring:true,name:c.tones[0].name});
    let counts=null;
    if(k>0&&!fin&&showCount){counts=new Map(); for(let s=1;s<=gap(k);s++) counts.set(placed[k-1]+s,s);}
    App.piano.configure({markers:mk,counts,ruler:false,select:false,fit:[base[0]-5,base[n-1]+6],spell:c.spell});
    line.replaceChildren(...c.tones.flatMap((t,i)=>{
      const st=h('span',{class:'rst'+(i<k?'':' todo')},i<k?ldot(t.color):h('span',{class:'ldot ring',style:'border-color:var(--line)'}),i<k?pretty(t.name):'?');
      return i===0?[st]:[h('span',{class:'rop'},'+'+gap(i)),st];}));
    if(fin) return;
    if(k===0) api.feedback(`Step 1: find the root, ${pretty(c.tones[0].name)}. It names the chord, so it’s red. ${LANDMARK[c.tones[0].pc]||''}`,'hint');
    else api.feedback(`Step ${k+1}: from ${pretty(c.tones[k-1].name)}, count up ${gap(k)} half steps. Every key counts, black or white${showCount?': the numbers above the keys do the counting':''}.`,'hint');
  }
  const ROLE_SAY=t=>t.deg===3?(t.semi===4?'the major third. This note makes the chord major.':t.semi===3?'the minor third. This note makes the chord minor.':'the third.')
    :t.deg===5?`the fifth, ${t.semi} half steps above the root. It makes the chord sound solid.`:t.deg===7?'the seventh. It adds color.':t.role.toLowerCase()+'.';
  App.piano.configure({fit:[base[0]-5,base[n-1]+6],force:true}); draw();
  return {
    onInput(e){if(fin||e.type!=='on') return;
      const want=target(); const okPc=mod(e.m,12)===c.tones[k].pc;
      if(okPc){const m=k===0?e.m:want; placed.push(m); k++;
        if(k>=n){fin=true; rec('chords',c.sym,slips===0); draw(); setTimeout(()=>Sound.chord(placed),350);
          api.feedback(`That’s ${c.label}: ${c.tones.map(t=>pretty(t.name)).join(', ')}.`,'ok');
          why.textContent=recipeWhy(c);  api.done();}
        else{draw(); if(k>1) api.feedback(`${pretty(c.tones[k-1].name)}: ${ROLE_SAY(c.tones[k-1])} Next, count ${gap(k)} more.`,'ok');}}
      else{slips++; mistake(`recipe ${c.label}: played ${COMMON[mod(e.m,12)]}`);
        if(k===0) api.feedback(`That’s ${pcName(mod(e.m,12))}. ${LANDMARK[c.tones[0].pc]}`,'bad');
        else{const from=placed[k-1], dist=e.m-from; showCount=true; draw();
          api.feedback(dist>0?`That’s ${dist} half step${dist>1?'s':''} up from ${pretty(c.tones[k-1].name)}. You need ${gap(k)}. Count along the numbers.`:`Go up from ${pretty(c.tones[k-1].name)}, to the right. Count ${gap(k)} keys.`,'bad');}}
    },
    ctx:()=>({task:'build a chord step by step',chord:c.sym,notesPlaced:k}),
    tip:()=>recipeWhy(c)
  };
};

  errText(e){return e.code==='not_granted'?'The teacher needs permission to use Claude in this view. Allow it when asked, or keep going with the tips above.':e.code==='rate_limited'?'Too many questions at once. Give it a minute.':e.code==='aborted'?'Stopped.':'The teacher couldn’t answer just now. Try again in a moment.';},
  async exercise(){

    this.drawMsgs();
  }
};

function askConfirm(msg,okLabel='OK'){return new Promise(res=>{
  const prev=document.activeElement; const bg=h('div',{class:'dlg-bg'}); const done=v=>{bg.remove(); document.removeEventListener('keydown',key,true); prev&&prev.focus&&prev.focus(); res(v);};
  const ok=h('button',{class:'btn primary',onclick:()=>done(true)},okLabel); const no=h('button',{class:'btn ghost',onclick:()=>done(false)},'Cancel');
  const box=h('div',{class:'dlg',role:'alertdialog','aria-modal':'true','aria-label':msg},closeBtn('Close',()=>done(false)),h('p',null,msg),h('div',{class:'dlg-act'},ok,no));
  const key=e=>{if(e.key==='Escape'){e.stopPropagation(); done(false);}}; document.addEventListener('keydown',key,true);
  bg.addEventListener('click',e=>{if(e.target===bg) done(false);}); bg.append(box); document.body.append(bg); ok.focus();});}
function printSheet(){let fired=false; const f=()=>{fired=true;}; window.addEventListener('beforeprint',f,{once:true});
  try{window.print();}catch(e){}
  setTimeout(()=>{window.removeEventListener('beforeprint',f); if(!fired) say('Printing is blocked inside Claude’s app viewer. Download the app and open it in Chrome to print this sheet.',10000);},600);}
function closeBtn(label,fn){const b=document.createElement('button'); b.type='button'; b.className='x-btn'; b.setAttribute('aria-label',label); b.innerHTML='<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; b.addEventListener('click',e=>{e.stopPropagation(); fn();}); return b;}
function featureAllowed(f){try{const p=document.permissionsPolicy||document.featurePolicy; return p&&p.allowsFeature?p.allowsFeature(f):true;}catch(e){return true;}}
const Mic={on:false,status:'off',msg:'',stream:null,an:null,buf:null,td:null,timer:null,cand:new Map(),rmsAvg:0,level:0,lastOnset:0,LAG:0.15,
  async start(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){this.status='unsupported'; this.msg='This browser can’t use the microphone here.'; UI.midi(); return;}
    this.status='asking'; UI.midi();
    if(!featureAllowed('microphone')){this.status='blocked'; this.msg='The microphone can’t be used inside Claude’s app viewer, even with Chrome’s permission on. To use it, download the app and open it in Chrome, or connect your piano with a USB cable.'; UI.midi(); say(this.msg,12000); return;}
    /* iPhone: the 'playback' audio session blocks the microphone (InvalidStateError), so switch to play-and-record first */
    try{if(navigator.audioSession) navigator.audioSession.type='play-and-record';}catch(e){}
    try{if(AudioUnlock.el) AudioUnlock.el.pause();}catch(e){}
    try{this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});}
    catch(e){this.status='blocked'; try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(_){}
      this.msg=e&&e.name==='NotAllowedError'?'The microphone was blocked. Allow it in the browser’s address bar and try again. If it still won’t start, the Claude viewer isn’t letting the page use the microphone: open the app on its own site, or connect your piano with a USB cable.':`The microphone didn’t start (${e&&e.name||'unknown error'}).`;
      UI.midi(); return;}
    const ctx=Sound.ensure(); try{await ctx.resume();}catch(e){}
    const src=ctx.createMediaStreamSource(this.stream); const an=ctx.createAnalyser(); an.fftSize=16384; an.smoothingTimeConstant=0; src.connect(an);
    this.an=an; this.buf=new Float32Array(an.frequencyBinCount); this.td=new Float32Array(2048);
    this.on=true; this.status='listening'; UI.midi(); this.timer=setInterval(()=>this.tick(),45);
  },
  stop(){clearInterval(this.timer); this.timer=null; if(this.stream) this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; this.an=null; this.on=false; this.status='off';
    try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
    for(const m of [...Input.src.mic.keys()]) Input.off('mic',m); this.cand.clear(); UI.midi();},
  release(){for(const m of [...Input.src.mic.keys()]) Input.off('mic',m); this.cand.clear();},
  detect(){
    const b=this.buf, sr=Sound.ctx.sampleRate, N=this.an.fftSize, hz=i=>i*sr/N;
    const lo=Math.floor(60*N/sr), hi=Math.ceil(1250*N/sr); let max=-Infinity;
    for(let i=lo;i<hi;i++) if(b[i]>max) max=b[i];
    if(max<-72) return [];

    for(let i=lo+1;i<hi-1;i++){const v=b[i]; if(v>thr&&v>b[i-1]&&v>=b[i+1]){const a=b[i-1],c=b[i+1]; const den=a-2*v+c; const p=den?0.5*(a-c)/den:0;
      const f=hz(i+p), mid=69+12*Math.log2(f/440), r=Math.round(mid); if(Math.abs(mid-r)>0.35) continue; const q=byM.get(r); if(!q||v>q.v) byM.set(r,{f,m:r,v});}}
    const list=[...byM.values()].sort((x,y)=>x.f-y.f), out=[];
    const at=f=>{const i=Math.round(f*N/sr); return i>0&&i<b.length?Math.max(b[i-1],b[i],b[i+1]):-200;};
    list.forEach((p,j)=>{let harm=false;
      for(let n=0;n<j;n++){const q=list[n]; const r=p.f/q.f, k=Math.round(r); if(k>=2&&k<=9&&Math.abs(r-k)/k<0.02&&p.v<q.v+6){harm=true;break;}
        if(Math.abs(r-1.5)<0.02&&p.v<q.v&&at(q.f/2)>thr-6&&!list.some(x=>Math.abs(x.f*2/q.f-1)<0.02)){harm=true;break;}}
      if(!harm) out.push(p);});
    return out.filter(p=>p.v>max-20).sort((x,y)=>y.v-x.v).slice(0,6).map(p=>p.m);
  },
  tick(){
    const an=this.an, ctx=Sound.ctx; if(!an||!ctx) return;
    an.getFloatTimeDomainData(this.td); let s=0; for(let i=0;i<this.td.length;i++) s+=this.td[i]*this.td[i]; const rms=Math.sqrt(s/this.td.length);
    this.level=rms; if(this.meter) this.meter.style.width=Math.min(100,Math.round(rms*900))+'%';
    if(ctx.currentTime<(Sound.busyUntil||0)){this.rmsAvg=rms; return;}
    const nearClick=Math.abs(ctx.currentTime-(Sound.lastClickAt??-9))<0.09;
    /* a real piano strike on the click is much louder than the click itself, so it still counts as a new note */
    const jump=rms>0.008&&rms>this.rmsAvg*1.45&&performance.now()-this.lastOnset>140;
    const onset=jump&&(!nearClick||(rms>0.02&&rms>this.rmsAvg*2.2));
    this.rmsAvg=this.rmsAvg*0.7+rms*0.3;
    if(onset){this.lastOnset=performance.now(); this.release();}
    an.getFloatFrequencyData(this.buf); const notes=rms<0.003?[]:this.detect();
    for(const m of [...notes].sort((x,y)=>x-y)){const c=this.cand.get(m)||{hit:0,miss:0}; c.hit++; c.miss=0; this.cand.set(m,c);
      if(c.hit<2||Input.src.mic.has(m)) continue; const same=[...Input.src.mic.keys()].find(x=>mod(x,12)===mod(m,12));
      if(same!=null){if(same>m){Input.off('mic',same); Input.on('mic',m,0.7,performance.now()-this.LAG*1000);}}
      else Input.on('mic',m,0.7,performance.now()-this.LAG*1000);}
    for(const [m,c] of this.cand) if(!notes.includes(m)){c.miss++; c.hit=Math.max(0,c.hit-1); if(c.miss>=5){this.cand.delete(m); if(Input.src.mic.has(m)) Input.off('mic',m);}}
  }
};

    const midiFull=st==='connected'?(Midi.input.name||'Keyboard connected'):mic?'Listening':st==='nodevice'?'No keyboard found':st==='asking'?'Connecting…':'Connect your piano'; $('#midiTxt').textContent=midiFull; $('#midiShort').textContent=st==='connected'?'Connected':mic?'Listening':st==='nodevice'?'No keyboard':st==='asking'?'Connecting…':'Keyboard'; $('#midiBtn').setAttribute('aria-label',midiFull);

        h('p',{class:'help'},'Turn this on to use your keyboard as a synthesizer. Pick the sound in the menu under the screen keyboard: piano, electric piano, synth, pad or organ. Leave it off if your piano has its own speakers and you only want to hear those.'));

const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

let popOpenedAt=0;

/* Fit the lesson to the window: shrink the keyboard (down to a usable minimum) so the step bar is visible without scrolling */
const Fit={busy:false,
  run(){if(this.busy) return; this.busy=true; requestAnimationFrame(()=>{this.busy=false; this.apply();});},
  apply(){const kb=App.piano&&App.piano.kb; if(!kb) return;
    const nav=document.querySelector('#main .run-nav'); const guide=[...document.querySelectorAll('#main .ws > *')].filter(e=>e.offsetHeight&&!e.classList.contains('run-nav')).pop();
    if(App.view!=='learn'||!nav||!guide||innerWidth<=700){if(kb.style.height) {kb.style.height=''; App.piano.render();} return;}
    const natural=parseFloat(getComputedStyle(kb).height)||0; const cur=kb.offsetHeight;
    const need=guide.getBoundingClientRect().bottom+scrollY+nav.offsetHeight+4;
